
services:
  backend:
    image: hlebusheek/minisocial-backend:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: "postgresql://minisocial:local_dev_password@postgres:5432/minisocial?schema=public"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - postgres
      - redis
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: minisocial
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: minisocial
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres_data:
