name: Build and Push MiniSocial

on:
  push:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: hlebusheek/minisocial-backend:latest

      - name: Deploy container
        shell: pwsh
        run: |
          docker rm -f minisocial-backend
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Old container was not running; continuing."
          }
          docker run -d --name minisocial-backend -p 3001:3000 hlebusheek/minisocial-backend:latest
